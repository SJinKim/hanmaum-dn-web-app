# KI-Entwicklungsteam – Projektkonfiguration
# Flache "key: value"-Zeilen werden von Skripten gelesen – Format bitte beibehalten.

project_key: HDN                 # Ticket-Präfix
product_name: Hanmaum DN
github_owner: SJinKim            # User oder Organisation, der das GitHub Project gehört
project_number: 7                # Nummer des GitHub Project (Board)
stage_field: Stage
base_branch: dev                 # Branches abzweigen von und PRs gegen diesen Branch
auto_merge: false                # true = nach Review (+ QA bei ui/size:M) + grüner CI automatisch mergen
codex_cloud_review: off          # mention = Developer kommentiert "@codex review" | auto = GitHub-Integration reviewt selbst | off
figma_file: https://www.figma.com/design/KSEMYc00jcgvyQ6qWt1cm4/DN-Web
staging_url: https://dn-admin-dashboard.st.graceops.de   # st-Umgebung für st-Tests
tester_login: graceops-tester    # Passwort nur in Jins Keychain (graceops-tester), nie im Repo

# Sprache
language_docs: de                # Issues, Kommentare, Doku
language_code: en                # Code, Commits, Branches

# Repos desselben Produkts (eine Zeile pro Repo)
repos:
  - SJinKim/hanmaum-dn-server
  - SJinKim/hanmaum-dn-web-app
  - SJinKim/hanmaum-dn-mobile-app

# Dieses Repo
repo_role: web                   # backend | web | mobile | ops | fullstack

# Befehle (von Developer, Reviewer und QA verwendet)
commands:
  build: npx ng build
  test: npx ng test --watch=false --browsers=ChromeHeadless
  lint: npx ng lint
  arch_test:
  e2e: npm run e2e:st             # Playwright gegen staging_url, braucht TESTER_PW
  run_local: npx ng serve       # :4200, /api -> :8080, Keycloak :8091

# Design-Puffer: so viele Tickets sollen mindestens in "Ready" liegen
ready_buffer: 3
