<!--
  Figma: 공지사항 222:9396, 공지 작성 dialog 222:11617.
-->
<div class="flex min-h-px flex-1 flex-col gap-gutter">
  <app-page-header
    [eyebrow]="'announcements.eyebrow' | translate"
    [heading]="'announcements.title' | translate"
    [subtitle]="'announcements.subtitle' | translate">
    <p-button
      appActions
      size="small"
      icon="pi pi-plus"
      [label]="'announcements.add' | translate"
      data-testid="announcement-add"
      (onClick)="openAdd()" />
  </app-page-header>

  <app-search-field
    [value]="search()"
    (valueChange)="search.set($event)"
    (cleared)="search.set('')"
    [label]="'announcements.search.aria' | translate"
    [placeholder]="'announcements.search.placeholder' | translate" />

  <div class="flex flex-wrap items-center gap-[var(--space-8)]" data-testid="category-filter">
    @for (chip of chips(); track chip.category) {
      <app-filter-chip
        [label]="chip.label"
        [count]="chip.count"
        [selected]="category() === chip.category"
        (toggled)="selectCategory(chip.category)" />
    }
  </div>

  @if (loading()) {
    <app-skeleton variant="card" />
  } @else if (failed()) {
    <app-empty-state
      [heading]="'announcements.loadFailed' | translate"
      [description]="'announcements.loadFailedHint' | translate" />
  } @else {
    <section
      class="bg-surface border-line-subtle shadow-elevation-sm flex flex-col gap-[var(--space-12)] rounded-[var(--radius-lg)] border p-card"
      data-testid="announcements-card">
      <app-section-header [heading]="'announcements.listHeading' | translate" />

      @if (rows().length === 0) {
        <app-empty-state
          [heading]="(announcements().length === 0 ? 'announcements.empty' : 'announcements.noMatch') | translate" />
      } @else {
        <ul class="flex flex-col">
          @for (row of rows(); track row.id) {
            <li
              class="border-line-subtle flex items-start gap-[var(--space-12)] border-t py-[var(--space-12)] first:border-t-0 first:pt-0"
              [attr.data-announcement]="row.id">
              <div class="flex min-w-0 flex-1 flex-col gap-[var(--space-4)]">
                <div class="flex min-w-0 items-center gap-[var(--space-8)]">
                  @if (row.isPinned) {
                    <i
                      class="pi pi-thumbtack text-primary shrink-0"
                      data-testid="pinned-icon"
                      [attr.aria-label]="'announcements.pinned' | translate"></i>
                  }
                  <span class="type-h3 text-ink-strong truncate">{{ row.title }}</span>
                </div>
                <p class="type-body-sm text-ink-muted line-clamp-1">{{ row.body }}</p>
                <div class="flex flex-wrap items-center gap-[var(--space-8)]">
                  <app-badge [variant]="row.badge.variant" [label]="row.badge.label" />
                  <span class="type-caption text-ink-muted">{{ row.period }}</span>
                </div>
              </div>
              <p-button
                icon="pi pi-ellipsis-v"
                severity="secondary"
                [text]="true"
                [rounded]="true"
                [ariaLabel]="'announcements.more' | translate"
                (onClick)="toggleRowMenu($event, row.id)" />
            </li>
          }
        </ul>
      }
    </section>
  }
</div>

<p-menu #rowMenu [model]="menuItems()" [popup]="true" appendTo="body" />

<app-announcement-dialog
  [(visible)]="dialogVisible"
  [announcement]="editing()"
  (saved)="onSaved()"
  (failed)="onSaveFailed()" />

<p-toast />
<p-confirmDialog />
