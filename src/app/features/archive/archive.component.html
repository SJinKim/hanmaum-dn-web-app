<!--
  Figma: 기록 · 양육 (741:39767) and 기록 · 사역 (741:41125). One card per course
  or ministry; on Phone the tables become stacks of list cards.
-->
<div class="flex flex-col gap-gutter">
  <app-page-header
    [eyebrow]="'archive.eyebrow' | translate"
    [heading]="'archive.title' | translate"
    [subtitle]="'archive.subtitle' | translate" />

  <app-segmented-control
    [class]="isPhone() ? 'w-full' : 'w-full max-w-[360px]'"
    [options]="tabOptions()"
    [(value)]="tab"
    [ariaLabel]="'archive.title' | translate" />

  @if (loading()) {
    <app-skeleton variant="card" />
  } @else if (sections().length === 0) {
    <app-empty-state
      [variant]="failed() ? 'error' : 'no-data'"
      [heading]="(failed() ? 'archive.error' : 'archive.empty.' + tab()) | translate" />
  } @else {
    @for (section of sections(); track section.id) {
      @if (isPhone()) {
        <!-- Figma 781:91274: on Phone the heading and the cards stand on the page, no card around them. -->
        <section class="flex flex-col gap-[var(--space-8)]" data-testid="archive-list">
          <app-section-header [heading]="section.heading" />
          @for (r of section.records; track r.id) {
            <app-list-card [record]="phoneRecord(r)" selectable="false" />
          }
        </section>
      } @else {
        <section class="bg-surface border-line-subtle shadow-elevation-sm flex flex-col gap-[var(--space-12)] rounded-[var(--radius-lg)] border p-card" data-testid="archive-card">
          <app-section-header [heading]="section.heading" />
          <app-data-table [rows]="section.records" [columns]="columns()" [caption]="section.heading" selectable="false" />
        </section>
      }
    }
  }
</div>
