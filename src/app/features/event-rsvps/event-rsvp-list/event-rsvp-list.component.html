<!-- Figma: 이벤트 · Desktop (220:8818); on Phone the table becomes list cards. -->
<p-toast />

<div class="flex flex-col gap-gutter">
  <app-page-header
    [eyebrow]="'events.eyebrow' | translate"
    [heading]="'events.title' | translate"
    [subtitle]="'events.subtitle' | translate">
    <div appActions>
      <p-button
        icon="pi pi-plus"
        [label]="'events.add' | translate"
        (onClick)="openAdd()"
        data-testid="add-event" />
    </div>
  </app-page-header>

  <div class="grid grid-cols-2 gap-gutter lg:grid-cols-4" data-testid="event-stats">
    <app-stat-card
      icon="pi pi-calendar"
      [label]="'events.stats.total' | translate"
      [value]="'' + stats().total"
      [subtext]="'events.stats.totalSub' | translate" />
    <app-stat-card
      icon="pi pi-users"
      [label]="'events.stats.open' | translate"
      [value]="'' + stats().open"
      [subtext]="'events.stats.openSub' | translate" />
    <app-stat-card
      icon="pi pi-clock"
      [label]="'events.stats.scheduled' | translate"
      [value]="'' + stats().scheduled"
      [subtext]="'events.stats.scheduledSub' | translate" />
    <app-stat-card
      icon="pi pi-check-circle"
      [label]="'events.stats.closed' | translate"
      [value]="'' + stats().closed"
      [subtext]="'events.stats.closedSub' | translate" />
  </div>

  <section
    class="bg-surface border-line-subtle shadow-elevation-sm flex flex-col gap-[var(--space-12)] rounded-[var(--radius-lg)] border p-card"
    data-testid="events-card">
    <app-section-header [heading]="'events.list' | translate" />

    @if (isPhone()) {
      @if (loading()) {
        <app-skeleton variant="card" />
      } @else if (records().length === 0) {
        <app-empty-state
          [heading]="'events.empty.heading' | translate"
          [description]="'events.empty.description' | translate" />
      } @else {
        <div class="flex flex-col gap-[var(--space-8)]">
          @for (r of records(); track r.id) {
            <app-list-card [record]="r" (selected)="openAttendees($event.id)" />
          }
        </div>
      }
    } @else {
      <app-data-table
        [rows]="records()"
        [columns]="columns()"
        [loading]="loading()"
        [caption]="'events.list' | translate"
        [emptyHeading]="'events.empty.heading' | translate"
        [emptyDescription]="'events.empty.description' | translate"
        selectable="false">
        <ng-template appDataCell="actions" let-record>
          <span class="flex items-center gap-[var(--space-4)]">
            <p-button
              icon="pi pi-users"
              [text]="true"
              [rounded]="true"
              severity="secondary"
              [ariaLabel]="'events.attendees' | translate"
              [pTooltip]="'events.attendees' | translate"
              tooltipPosition="top"
              (onClick)="openAttendees(record.id)"
              [attr.data-testid]="'attendees-' + record.id" />
            <p-button
              icon="pi pi-pencil"
              [text]="true"
              [rounded]="true"
              severity="secondary"
              [ariaLabel]="'events.edit' | translate"
              [pTooltip]="'events.edit' | translate"
              tooltipPosition="top"
              (onClick)="openEdit(record.id)"
              [attr.data-testid]="'edit-' + record.id" />
          </span>
        </ng-template>
      </app-data-table>
    }
  </section>
</div>

<app-event-rsvp-dialog
  [(visible)]="dialogVisible"
  [rsvp]="editing()"
  (saved)="onSaved()"
  (failed)="onSaveFailed()" />
