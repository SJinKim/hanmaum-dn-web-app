<p-dialog
  [header]="'ministry.detail.addDialog.header' | translate"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [style]="{ width: '28rem' }"
  [draggable]="false"
  [resizable]="false"
>
  <form [formGroup]="form" class="flex flex-col gap-[var(--space-16)] pt-[var(--space-8)]">
    <div class="flex flex-col gap-[var(--space-4)]">
      <label for="add-member-select" class="type-caption text-ink-muted">{{ 'ministry.detail.addDialog.member' | translate }}</label>
      <p-select
        inputId="add-member-select"
        formControlName="memberId"
        [options]="memberOptions()"
        optionLabel="label"
        optionValue="value"
        [filter]="true"
        filterBy="label"
        [placeholder]="'ministry.detail.addDialog.memberPlaceholder' | translate"
        class="w-full"
      />
    </div>

    <div class="flex flex-col gap-[var(--space-4)]">
      <label for="add-member-year" class="type-caption text-ink-muted">{{ 'ministry.detail.addDialog.startDate' | translate }}</label>
      <div class="flex items-center gap-[var(--space-8)]">
        <p-select
          inputId="add-member-year"
          formControlName="startYear"
          [options]="yearOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="YY"
          [ariaLabel]="('ministry.detail.addDialog.startDate' | translate) + ' ' + ('ministry.detail.addDialog.year' | translate)"
          class="w-20" />
        <span class="type-body text-ink-muted" data-testid="year-unit">{{ 'ministry.detail.addDialog.year' | translate }}</span>
        <p-select
          formControlName="startMonth"
          [options]="monthOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="MM"
          [ariaLabel]="('ministry.detail.addDialog.startDate' | translate) + ' ' + ('ministry.detail.addDialog.month' | translate)"
          class="w-20" />
        <span class="type-body text-ink-muted" data-testid="month-unit">{{ 'ministry.detail.addDialog.month' | translate }}</span>
      </div>
    </div>

    <div class="flex flex-col gap-[var(--space-4)]">
      <label for="add-member-note" class="type-caption text-ink-muted">{{ 'ministry.detail.addDialog.note' | translate }}</label>
      <input id="add-member-note" pInputText formControlName="note" maxlength="500" class="w-full" />
    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button [label]="'ministry.detail.addDialog.cancel' | translate" severity="secondary" [text]="true" (onClick)="close()" />
    <p-button [label]="'ministry.detail.addDialog.submit' | translate" icon="pi pi-plus" [loading]="saving()" (onClick)="submit()" />
  </ng-template>
</p-dialog>

<p-toast />
