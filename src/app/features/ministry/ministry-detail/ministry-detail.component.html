<!--
  Figma: 사역 상세 · Desktop · Light (204:6930). One card 팀원; on Phone the
  table becomes a stack of list cards.
-->
<div class="flex flex-col gap-gutter">
  <app-page-header
    hasBack
    [breadcrumb]="breadcrumb()"
    [eyebrow]="'ministry.detail.eyebrow' | translate"
    [heading]="ministry()?.title ?? ('ministry.title' | translate)"
    [subtitle]="subtitle()"
    (back)="goBack()">
    @if (ministry()) {
      <div appActions class="flex items-center gap-[var(--space-8)]">
        <p-button
          icon="pi pi-pencil"
          severity="secondary"
          [outlined]="true"
          [label]="'ministry.detail.edit' | translate"
          (onClick)="goToEdit()" />
        @if (moreItems().length > 0) {
          <p-button
            icon="pi pi-ellipsis-v"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            [ariaLabel]="'ministry.detail.more' | translate"
            (onClick)="toggleMore($event)" />
          <p-menu #moreMenu [model]="moreItems()" [popup]="true" appendTo="body" />
        }
      </div>
    }
  </app-page-header>

  @if (loading()) {
    <app-skeleton variant="card" />
  } @else if (ministry()) {
    <section
      class="bg-surface border-line-subtle shadow-elevation-sm flex flex-col gap-[var(--space-12)] rounded-[var(--radius-lg)] border p-card"
      data-testid="members-card">
      <app-section-header [heading]="'ministry.detail.members' | translate">
        <p-button
          appActions
          icon="pi pi-plus"
          size="small"
          severity="secondary"
          [outlined]="true"
          [label]="'ministry.detail.addMember' | translate"
          (onClick)="openAddMember()" />
      </app-section-header>

      @if (isPhone()) {
        @if (membersLoading()) {
          <app-skeleton variant="card" />
        } @else if (records().length === 0) {
          <app-empty-state
            [heading]="'ministry.detail.membersEmpty.heading' | translate"
            [description]="'ministry.detail.membersEmpty.description' | translate" />
        } @else {
          <div class="flex flex-col gap-[var(--space-8)]">
            @for (r of records(); track r.id) {
              <app-list-card [record]="r" (selected)="goToMember($event.id)" />
            }
          </div>
        }
      } @else {
        <app-data-table
          [rows]="records()"
          [columns]="columns()"
          [loading]="membersLoading()"
          [caption]="'ministry.detail.members' | translate"
          [emptyHeading]="'ministry.detail.membersEmpty.heading' | translate"
          [emptyDescription]="'ministry.detail.membersEmpty.description' | translate"
          [editLabel]="'ministry.detail.editMember' | translate"
          [deleteLabel]="'ministry.detail.removeMember' | translate"
          (rowSelected)="goToMember($event.id)"
          (edit)="openEditMember($event.id)"
          (remove)="confirmRemoveMember($event.id)" />
      }
    </section>

    <app-ministry-add-member-dialog
      [(visible)]="addDialogVisible"
      [ministryPublicId]="ministry()!.publicId"
      (added)="onMemberAdded()" />

    <app-ministry-member-edit-dialog
      [(visible)]="editDialogVisible"
      [ministryPublicId]="ministry()!.publicId"
      [member]="editingMember()"
      (saved)="onMemberEdited()"
      (failed)="onMemberEditFailed()" />
  } @else {
    <app-empty-state
      variant="error"
      [heading]="'ministry.detail.notFound.heading' | translate"
      [description]="'ministry.detail.notFound.description' | translate"
      [actionLabel]="'ministry.detail.notFound.action' | translate"
      actionIcon="pi pi-arrow-left"
      (action)="goBack()" />
  }
</div>

<p-confirmDialog />
<p-toast />
