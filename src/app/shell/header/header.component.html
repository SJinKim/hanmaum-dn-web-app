<header
  class="flex h-[var(--size-topbar)] shrink-0 items-center justify-between overflow-clip border-b border-line-subtle bg-surface p-[var(--space-20)]"
>
  <!-- Figma: Topbar > left cluster — the Drawer button replaces the brand block on Phone -->
  <div class="flex items-center gap-[var(--space-10)]">
    @if (isPhone()) {
      <button
        type="button"
        (click)="drawerToggle.emit()"
        [attr.aria-label]="'shell.nav.open' | translate"
        class="flex size-[44px] shrink-0 items-center justify-center rounded-[var(--radius-md)] text-ink-strong hover:bg-surface-subtle focus-visible:[outline:2px_solid_var(--color-focus)] focus-visible:[outline-offset:2px]"
      >
        <i class="pi pi-th-large text-[16px]"></i>
      </button>
      <span class="type-h3 whitespace-nowrap tracking-brand text-ink-strong">한마음 D+N</span>
    } @else {
      <div class="flex flex-col">
        <span class="type-h3 whitespace-nowrap tracking-brand text-ink-strong">한마음 D+N</span>
        <span class="type-overline text-ink-muted">Church Management</span>
      </div>
    }
  </div>

  <!-- Figma: Topbar > right cluster — pending chip, theme, language, avatar -->
  <div class="flex items-center gap-[var(--space-10)]">
    @if (showPending()) {
      <button
        type="button"
        (click)="goToPending()"
        [attr.aria-label]="'shell.pending.aria' | translate: { count: pendingCount() }"
        class="flex shrink-0 items-center rounded-[var(--radius-sm)] focus-visible:[outline:2px_solid_var(--color-focus)] focus-visible:[outline-offset:2px]"
      >
        <app-badge
          variant="inactive"
          size="small"
          [label]="'shell.pending.label' | translate: { count: pendingCount() }"
        />
      </button>
    }

    <button
      type="button"
      (click)="toggleTheme()"
      [attr.aria-label]="(isDark() ? 'shell.theme.light' : 'shell.theme.dark') | translate"
      class="flex size-[var(--size-icon-button)] shrink-0 items-center justify-center rounded-[var(--radius-md)] text-ink-muted hover:bg-surface-subtle hover:text-ink-strong focus-visible:[outline:2px_solid_var(--color-focus)] focus-visible:[outline-offset:2px]"
    >
      <i class="pi text-[16px]" [class]="isDark() ? 'pi-sun' : 'pi-moon'"></i>
    </button>

    <button
      type="button"
      (click)="toggleLang()"
      [attr.aria-label]="'shell.lang.aria' | translate"
      class="flex size-[var(--size-icon-button)] shrink-0 items-center justify-center rounded-[var(--radius-md)] text-ink-muted hover:bg-surface-subtle hover:text-ink-strong focus-visible:[outline:2px_solid_var(--color-focus)] focus-visible:[outline-offset:2px]"
    >
      <i class="pi pi-globe text-[16px]"></i>
    </button>

    <button
      type="button"
      (click)="toggleMenu($event)"
      [attr.aria-label]="'shell.menu.aria' | translate"
      [attr.title]="accountName()"
      aria-haspopup="true"
      class="flex shrink-0 items-center rounded-[var(--radius-full)] focus-visible:[outline:2px_solid_var(--color-focus)] focus-visible:[outline-offset:2px]"
    >
      <app-avatar [name]="accountName()" [size]="32" decorative />
    </button>

    <p-menu #userMenu [model]="menuItems()" [popup]="true" appendTo="body">
      <ng-template pTemplate="submenuheader" let-item>
        <span class="type-body font-bold text-ink-strong">{{ item.label }}</span>
      </ng-template>
    </p-menu>
  </div>
</header>
